services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_API_BASE_URL: http://api:8000
      CHROMA_PERSIST_DIR: /data/chroma_db
      SQLITE_DB_PATH: /data/rag_app.db
    volumes:
      - rag-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ui:
    build: .
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      APP_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  rag-data:
