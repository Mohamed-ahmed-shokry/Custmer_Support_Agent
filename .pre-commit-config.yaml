repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint (--fix)
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format (check)
        entry: python -m ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy typecheck
        entry: python -m mypy api/ app/ scripts/
        language: system
        pass_filenames: false